<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日常提醒 · 工作记录</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/manifest.json">
</head>
<body>
    <div id="app">
        <!-- 顶部栏 -->
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">📋 工作记录</h1>
                <span class="today-label" id="todayLabel">加载中...</span>
            </div>
            <div class="header-right">
                <button class="btn-icon" id="btnHistory" title="历史记录">📅</button>
                <button class="btn-icon" id="btnSettings" title="设置">⚙️</button>
            </div>
        </header>

        <!-- 快速统计 -->
        <div class="stats-bar" id="statsBar">
            <span class="stat-item done"><span id="statDone">0</span> 已完成</span>
            <span class="stat-sep">|</span>
            <span class="stat-item pending"><span id="statPending">0</span> 未完成</span>
            <span class="stat-sep">|</span>
            <span class="stat-item total">共 <span id="statTotal">0</span> 项</span>
        </div>

        <!-- 添加任务 -->
        <div class="add-task">
            <input type="text" id="taskInput" placeholder="记录一项工作…" maxlength="500" autocomplete="off">
            <button class="btn-primary" id="btnAdd">➕ 添加</button>
        </div>

        <!-- 任务列表 -->
        <div class="task-sections" id="taskSections">
            <!-- 已完成 -->
            <div class="task-section">
                <h2 class="section-title completed-title">✅ 已完成</h2>
                <ul class="task-list" id="completedList">
                    <li class="empty-hint">暂无已完成的工作</li>
                </ul>
            </div>
            <!-- 未完成 -->
            <div class="task-section">
                <h2 class="section-title pending-title">⏳ 未完成</h2>
                <ul class="task-list" id="pendingList">
                    <li class="empty-hint">暂无未完成的工作</li>
                </ul>
            </div>
        </div>

        <!-- 日期选择器 (历史记录弹窗) -->
        <div class="modal-overlay hidden" id="historyModal">
            <div class="modal">
                <div class="modal-header">
                    <h2>📅 历史记录</h2>
                    <button class="btn-close" id="closeHistory">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="date-picker">
                        <input type="date" id="historyDate">
                        <button class="btn-primary" id="btnGoDate">查看</button>
                    </div>
                    <div class="recent-dates" id="recentDates">
                        <p class="hint">最近有记录的天：</p>
                        <div class="date-chips" id="dateChips"></div>
                    </div>
                    <div class="history-tasks" id="historyTasks"></div>
                </div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div class="modal-overlay hidden" id="settingsModal">
            <div class="modal">
                <div class="modal-header">
                    <h2>⚙️ 提醒设置</h2>
                    <button class="btn-close" id="closeSettings">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="setting-row">
                        <label class="setting-label">
                            <span>☀️ 早上提醒</span>
                            <input type="time" id="morningTime" value="09:00">
                        </label>
                        <label class="switch">
                            <input type="checkbox" id="morningEnabled" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="setting-row">
                        <label class="setting-label">
                            <span>🌤 中午提醒</span>
                            <input type="time" id="noonTime" value="12:30">
                        </label>
                        <label class="switch">
                            <input type="checkbox" id="noonEnabled" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="setting-info">
                        <p>💡 提醒通过桌面通知发送（Windows）或浏览器通知推送（Android）</p>
                        <p>📱 Android 在同一 Wi-Fi 下访问本机 IP 即可同步使用</p>
                    </div>
                    <div class="setting-actions">
                        <button class="btn-primary" id="btnSaveSettings">💾 保存设置</button>
                        <span class="save-feedback hidden" id="saveFeedback">✅ 已保存</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 编辑任务弹窗 -->
        <div class="modal-overlay hidden" id="editModal">
            <div class="modal modal-sm">
                <div class="modal-header">
                    <h2>✏️ 编辑任务</h2>
                    <button class="btn-close" id="closeEdit">&times;</button>
                </div>
                <div class="modal-body">
                    <textarea id="editInput" rows="3" maxlength="500"></textarea>
                    <div class="edit-actions">
                        <button class="btn-primary" id="btnSaveEdit">💾 保存</button>
                        <button class="btn-danger" id="btnDeleteTask">🗑 删除</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
