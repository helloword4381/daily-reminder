name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android_app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            platform-tools
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        id: build
        run: |
          cd android_app
          gradle assembleRelease --no-daemon --build-cache
          echo "=== APK search ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== AAB search ==="
          find . -name "*.aab" -type f 2>/dev/null
          echo "=== build dir ==="
          ls -la app/build/outputs/ 2>/dev/null || echo "No outputs dir"
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release dir"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reminder-apk
          path: android_app/**/*.apk
          if-no-files-found: error
          retention-days: 30
