name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android_app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            platform-tools
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        id: build
        run: |
          cd android_app
          gradle assembleDebug --no-daemon --build-cache
          # 查找 APK 并保存路径
          APK=$(find . -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "Found APK: $APK"

      - name: Compute MD5 + Generate build-info.json
        run: |
          cd android_app
          VERSION_NAME=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' app/build.gradle.kts)
          APK_PATH_VAL="${{ env.APK_PATH }}"
          MD5=$(md5sum "$APK_PATH_VAL" | cut -d' ' -f1)
          APK_NAME=$(basename "$APK_PATH_VAL")
          printf '{"versionName":"%s","versionCode":%s,"buildNumber":%s,"md5":"%s","apkName":"%s"}\n' \
            "$VERSION_NAME" "$VERSION_CODE" "${{ github.run_number }}" "$MD5" "$APK_NAME" > build-info.json
          echo "build-info.json: $(cat build-info.json)"
          echo "BUILD_INFO_PATH=build-info.json" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 构建 #${{ github.run_number }}
          body: |
            📱 自动构建 Android APK
            
            构建时间：${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            提交：${{ github.sha }}
          files: |
            android_app/${{ env.APK_PATH }}
            android_app/${{ env.BUILD_INFO_PATH }}
          generate_release_notes: false
          make_latest: true
